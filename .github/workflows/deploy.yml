name: Deploy GitHub Pages

# Chạy khi có commit lên main, và mỗi 6 giờ để bản HTML build sẵn (cho Google/SEO)
# luôn khớp nội dung mới nhất trên Supabase. Người xem luôn thấy nội dung mới ngay khi mở trang.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Lưu liên tục nhiều lần thì chỉ deploy bản mới nhất
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
